name: Daily Signal Scan

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST, ~30 min after NSE close (15:30 IST).
    # Runs Mon-Fri only (cron day-of-week 1-5).
    - cron: "30 10 * * 1-5"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the results JSON back

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r signal_engine/requirements.txt

      - name: Run signal scan
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          # Universe is deliberately "watchlist" by default — see the note
          # in README about Alpha Vantage's free-tier daily call budget
          # before switching this to nifty50/nifty100.
          UNIVERSE: ${{ vars.UNIVERSE || 'watchlist' }}
        run: python -m signal_engine.main --universe "$UNIVERSE" --top 15

      - name: Commit results back to repo
        run: |
          git config user.name "signal-engine-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ || true
          if git diff --cached --quiet; then
            echo "No new output to commit."
          else
            git commit -m "Daily signal scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
